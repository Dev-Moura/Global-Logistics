version: '3.8'

services:
  db:
    image: postgres:15
    container_name: logistics-db
    restart: always
    environment:
      - POSTGRES_DB=global_logistics
      - POSTGRES_USER=dev_user
      - POSTGRES_PASSWORD=dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  
volumes:
  postgres_data: