spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: test-only-secret-change-me-please-32bytes-min
    access-ttl: 15m
    refresh-ttl: 7d
    issuer: global-logistics-test
    audience: global-logistics-test-client

logging:
  level:
    com.michael.global_logistics_api: INFO
