spring:
  application:
    name: global-logistics-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/${DB_NAME}}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

info:
  app:
    name: global-logistics-api
    version: 1.0.0
    description: Global Logistics API

app:
  jwt:
    secret: ${APP_JWT_SECRET:}
    access-ttl: ${APP_JWT_ACCESS_TTL:15m}
    refresh-ttl: ${APP_JWT_REFRESH_TTL:7d}
    issuer: ${APP_JWT_ISSUER:global-logistics-api}
    audience: ${APP_JWT_AUDIENCE:global-logistics-client}
